# Daily content: 3 feed posts + 3 reels on the Instagram account.
#
# Three stages, in this order, because Meta's fetcher must be able to GET the
# media BEFORE the publish container is created:
#
#   1. build      render the images/reels, upload them as an artifact
#   2. pages      put them on GitHub Pages so they have a public https URL
#   3. publish    hand the URLs to the Graph API
#
# THE SCHEDULE IS COMMENTED OUT ON PURPOSE - nothing runs until you approve
# it. Until then the only way to run this is the manual "Run workflow"
# button, and even then the in-code gate (DRY_RUN / APPROVED) keeps it from
# publishing unless the publish input is set to 'yes'.
name: daily-content

on:
  workflow_dispatch:
    inputs:
      posts:
        description: "feed posts to make"
        required: false
        default: "3"
      reels:
        description: "reels to make"
        required: false
        default: "3"
      publish:
        description: "set to 'yes' to actually publish (needs secrets + approval)"
        required: false
        default: "no"
  # schedule:                   # enable ONLY after you say go
  #   - cron: "30 8 * * *"      # 08:30 UTC - check your own timezone first

permissions:
  contents: write              # commit state/seen.json back after a run

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      day: ${{ steps.day.outputs.day }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation
          pip install -r requirements.txt

      # Offline and free: fails fast on a subtitle timing bug before the
      # run spends a Gemini request or downloads any footage.
      - name: Subtitle tests
        run: |
          cd bot
          python test_talk.py

      - name: Restore state (prevents duplicate hooks across runs)
        run: |
          mkdir -p state
          if [ ! -f state/seen.json ]; then echo '{"hooks":[],"published":[],"counters":{"post":0,"reel":0},"dates":{}}' > state/seen.json; fi

      # Secrets live only in the repository settings, never in the code:
      #   GEMINI_KEY, PEXELS_KEY, IG_ACCESS_TOKEN, IG_USER_ID, PUBLIC_BASE,
      #   PINTEREST_TOKEN (optional)
      - name: Render today's content
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          POSTS: ${{ github.event.inputs.posts || '3' }}
          REELS: ${{ github.event.inputs.reels || '3' }}
        run: |
          cd bot
          python -m pipeline --posts="$POSTS" --reels="$REELS" --render-only

      - name: Record the day
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Upload deliverables (images, reels, report)
        uses: actions/upload-artifact@v4
        with:
          name: content-${{ github.run_number }}
          path: |
            out/public/
            out/report-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit state so hooks are never repeated
        run: |
          git config user.name "daily-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f state/seen.json || true
          git diff --cached --quiet || git commit -m "state: record published hooks [skip ci]"
          git push || true

  # Meta's fetcher cannot reach Actions artifacts, so the files must be
  # reachable at PUBLIC_BASE. GitHub Pages from the same repo is the simplest
  # option - enable it once under Settings -> Pages -> Source: GitHub Actions.
  pages:
    needs: build
    if: github.event.inputs.publish == 'yes'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: content-${{ github.run_number }}
          path: out
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/public
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: [build, pages]
    if: github.event.inputs.publish == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pipeline.py imports render -> PIL the moment it starts, so this job
      # needs the requirements too, not just the build job
      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: content-${{ github.run_number }}
          path: out

      - name: Restore state
        run: |
          mkdir -p state
          if [ ! -f state/seen.json ]; then echo '{"hooks":[],"published":[],"counters":{"post":0,"reel":0},"dates":{}}' > state/seen.json; fi

      - name: Wait for Pages to answer
        run: |
          BASE="${{ secrets.PUBLIC_BASE }}"
          DAY="${{ needs.build.outputs.day }}"
          if [ -z "$BASE" ]; then echo "PUBLIC_BASE is not set"; exit 1; fi
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/$DAY/" || true)
            echo "try $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "media never became reachable at $BASE/$DAY/"
          exit 1

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PUBLIC_BASE: ${{ secrets.PUBLIC_BASE }}
          DRY_RUN: "0"
          APPROVED: "1"
        run: |
          cd bot
          python -m pipeline --publish-only

      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: out/report-*.json
          retention-days: 30

      - name: Commit state
        run: |
          git config user.name "daily-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f state/seen.json || true
          git diff --cached --quiet || git commit -m "state: published [skip ci]"
          git push || true
